[package]
name = "solidinserts"
version = "1.2.0"
edition = "2024"
license = "MIT"
description = "Plugin SolidCraft per le sedi degli inserti filettati a caldo"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
